<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{background:#0f1115;color:#e8e6e3;font-family:"Segoe UI",system-ui,sans-serif;

</style></head><body>
  <h1>allegedly</h1>

<span class="al">allegedly</span>  Mobile layout OK  <span class="dim">to check: open /login at 375px</span></div>
